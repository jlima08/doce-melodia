<p-toast></p-toast>
<p-confirmDialog>
  <ng-template #message let-message>
    <div
      class="flex flex-col items-center w-full gap-4 border-b border-surface-200 dark:border-surface-700"
    >
      <i [ngClass]="message.icon" class="!text-6xl text-primary-500"></i>
      <p>{{ message.message }}</p>
      <div class="flex items-center gap-2 mb-3">
        <p-checkbox [(ngModel)]="reposicao" [binary]="true"> </p-checkbox>
        <label>Aula de reposição</label>
      </div>
    </div>
  </ng-template>
</p-confirmDialog>
<app-card-page title="Detalhes das Aulas" icon="pi pi-headphones">
  <div class="info">
    <div>
      <label for="">Professor </label>
      <input pInputText value="{{ aula?.professorNome }}" disabled />
    </div>
    <div>
      <label for="">Aluno</label>
      <input pInputText value="{{ aula?.alunoNome }}" disabled />
    </div>
    <div>
      <label for="">Dia</label>
      <input pInputText value="{{ aula?.diaSemana }}" disabled />
    </div>
    <div>
      <label for="">Hora</label>
      <input pInputText value="{{ aula?.horario }}" disabled />
    </div>
    <div>
      <label for="">Instrumento</label>
      <input pInputText value="{{ aula?.instrumento }}" disabled />
    </div>
    <div>
      <label for="">Data início</label>
      <input
        pInputText
        value="{{ aula?.dataInicio | date: 'dd/MM/yyyy' }}"
        disabled
      />
    </div>
    <div>
      <p-button
        size="large"
        icon="pi pi-check-circle"
        label="Marcar Aula"
        severity="secondary"
        (onClick)="modalCheck($event)"
      >
      </p-button>
    </div>
  </div>

  <p-table
    [value]="presencas"
    [paginator]="true"
    [rows]="5"
    [rowsPerPageOptions]="[5, 10, 20]"
    stripedRows
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="dataHora">Data <p-sortIcon field="dataHora" /></th>
        <th>Hora</th>
        <th>Reposição</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-presenca>
      <tr>
        <td>
          {{ presenca.dataHora.toDate() | date: "dd/MM/yyyy" }}
        </td>

        <td>
          {{ presenca.dataHora.toDate() | date: "HH:mm" }}
        </td>
        <td>
          @if (presenca.reposicao) {
            <p-tag severity="secondary" value="Sim"> </p-tag>
          } @else {
            <p-tag severity="success" value="Não"> </p-tag>
          }
        </td>
      </tr>
    </ng-template>
  </p-table>
</app-card-page>
